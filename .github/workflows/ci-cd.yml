# ============================================================================
# CI/CD — Identity Service (G2)
#
# ¿Qué hace este archivo? Define el "pipeline": una serie de trabajos (jobs)
# que GitHub ejecuta automáticamente en sus servidores cada vez que alguien
# sube código (push) o abre un Pull Request.
#
# Flujo:  push a main → [CI: verificar] → [CD: deploy a Render] → [Smoke test]
#         Pull Request → [CI: verificar] (no despliega)
#
# Si un job falla, los siguientes NO se ejecutan. Así nunca se despliega
# código roto.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # JOB 1 — CI: verificación del código.
  # Instala dependencias y comprueba que el TypeScript no tiene errores de
  # tipos y que compila. Es la "puerta de calidad" del pipeline.
  # --------------------------------------------------------------------------
  ci:
    name: CI — Verificar código
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Verificar tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Compilar (tsc)
        run: npm run build

  # --------------------------------------------------------------------------
  # JOB 2 — CD: deploy a Render.
  # Solo corre si el job "ci" pasó (needs: ci) y solo en push a main
  # (los Pull Requests no despliegan). Llama al "Deploy Hook" de Render:
  # una URL secreta que, al recibir un POST, le ordena a Render
  # reconstruir y publicar el servicio.
  # --------------------------------------------------------------------------
  deploy:
    name: CD — Deploy a Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # --------------------------------------------------------------------------
  # JOB 3 — Seed: usuarios de prueba.
  # Crea (o actualiza) en Supabase los usuarios fijos que la colección Postman
  # necesita: juan@correo.cl (customer) y maria@correo.cl (admin). Es
  # idempotente, así que puede correr en cada push sin duplicar datos. Sin este
  # paso, el smoke test falla porque esos usuarios no existen.
  # --------------------------------------------------------------------------
  seed:
    name: Seed — usuarios de prueba
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Sembrar usuarios semilla
        run: npm run seed

  # --------------------------------------------------------------------------
  # JOB 4 — Smoke test: verificación post-deploy.
  # Espera a que el servicio recién desplegado responda en /health y luego
  # ejecuta la carpeta "Auth" de la colección Postman con newman (el runner
  # de Postman para terminal) contra la URL pública.
  # --------------------------------------------------------------------------
  smoke:
    name: Smoke test — API pública
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Esperar a que el servicio esté arriba
        run: |
          echo "Render free tarda ~1-3 min en redesplegar; esperando..."
          sleep 90
          for i in $(seq 1 30); do
            if curl -sf "${{ vars.SERVICE_URL }}/health" > /dev/null; then
              echo "Servicio arriba"
              exit 0
            fi
            echo "Intento $i/30: aún no responde, reintento en 10 s..."
            sleep 10
          done
          echo "ERROR: el servicio no respondió a tiempo"
          exit 1

      - name: Pruebas funcionales contra la URL pública (newman)
        run: |
          npx newman run postman/Identity-Service-G2.postman_collection.json \
            --folder Auth \
            --env-var base_url="${{ vars.SERVICE_URL }}" \
            --reporters cli
