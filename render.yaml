# Blueprint de Render para desplegar el mock como Web Service gratuito.
# En Render: New + -> Blueprint -> conecta este repo. O crea un Web Service
# manual con Build: `npm install`  y  Start: `npm start`.
services:
  - type: web
    name: identity-service-g2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # El deploy lo dispara GitHub Actions (Deploy Hook) SOLO si el CI pasa.
    # Por eso desactivamos el auto-deploy nativo de Render.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio
      - key: ACCESS_TOKEN_TTL
        value: "3600"
      # sync: false = Render pide el valor a mano en el dashboard (son
      # secretos de Supabase; nunca deben ir en el repo).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
